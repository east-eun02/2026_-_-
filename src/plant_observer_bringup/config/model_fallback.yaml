# 기본값과 같다(patrol_manager는 model_fallback 기본 켜짐). 경로·제한 시간을 바꿀 때만 쓴다. 정상 비교 결과는 바꾸지 않는다.
patrol_manager:
  ros__parameters:
    model_fallback: true
    model_python: ~/plant_ws/.model_runtime/bin/python
    model_weights: ~/plant_ws/models/yolo11n-seg.pt
    model_timeout: 20.0
    # 열매 판정용 사과 검출 모델(팀원 학습 YOLO26n). apple_model: false면 색 규칙만 쓴다
    apple_model: true
    apple_weights: ~/plant_ws/models/apple_yolo26n_aug_v1.pt
