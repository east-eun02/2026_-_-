# demo 월드(시연 구역 2.7 x 1.8m) 순찰 루트 (patrol_manager route:=demo)
# 좌표는 지도(map) 기준: 출발점 = (0, 0), +x = 출발할 때 로봇 정면(화분 쪽)
# 로봇을 Gazebo (0.0, -0.4)에 북쪽을 보고 놓고 지도를 만들었을 때의 좌표다.
# 화분: plant_00 = 지도 (0.8, -0.6), plant_01 = 지도 (0.8, 0.6). (Gazebo (±0.6, 0.4))
# 관측 지점은 화분 중심에서 0.5m 앞 (제자리 회전 때 차체가 화분에 닿지 않는 거리)
home: {x: 0.0, y: 0.0, yaw: 0.0}
stops:
  - {id: P00, x: 0.3, y: -0.6, yaw: 0.0}
  - {id: P01, x: 0.3, y: 0.6, yaw: 0.0}
