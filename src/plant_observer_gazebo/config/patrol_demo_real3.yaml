# 실물 시연 구역(2.7 x 1.8m) 순찰 루트, 지도 maps/demo_real3.yaml 기준 (patrol_manager route:=demo_real3)
# demo_real3는 구석에서 긴 벽 방향을 보고 출발해 만든 지도다:
#   출발점 = 지도 원점 = 뒤쪽(짧은) 벽에서 0.33m, 오른쪽 긴 벽에서 0.31m, 긴 벽을 따라 앞을 봄
#   지도 +x = 긴 벽 방향(약 -1.5° 기울어짐), 지도 +y = 왼쪽 긴 벽 쪽
# 화분은 왼쪽 긴 벽 앞: 벽에서 0.5m, 긴 벽 가운데에서 앞뒤로 0.6m (뒤쪽 벽에서 0.73m·1.93m)
#   plant_00 = 지도 (1.63, 0.97), plant_01 = 지도 (0.43, 1.00). Gazebo demo 월드 배치와 같다.
# 관측 지점은 화분 중심에서 0.5m 앞에서 화분(왼쪽 벽)을 본다. home이 지도 원점이라 /initialpose는 보내지 않는다.
# 실물 U20CAM이 옆으로 달려 있어 사진을 시계 방향 90° 돌려 저장한다 (patrol_manager image_rotation)
image_rotation: 90
# 정면 비교에만 사용. 등록 사진은 보드 위치를 찾는 용도이며 변화 비교 기준은 직전 순찰이다.
# 경계 좌표는 아래 등록 사진(480x640) 기준. 사진마다 보드 특징점으로 위치를 다시 찾는다.
# 경계에서 6px 안쪽을 사용하며 가장자리·보드 밖으로 나온 부분은 비교에서 제외한다.
# 보드 도안이나 형태를 바꾸면 등록 사진/경계를 다시 설정한다. 찾기 실패 시 전체 화면 비교 금지.
comparison_scope: board
comparison_boards:
  P00:
    image: vision/demo_real3/P00_board.png
    polygon: [[118, 214], [344, 214], [352, 326], [344, 566], [137, 566], [122, 442], [113, 322]]
  P01:
    image: vision/demo_real3/P01_board.png
    polygon: [[83, 208], [280, 208], [309, 300], [310, 589], [100, 589], [72, 481], [64, 320]]
# 실물 끝벽 근처에서 35° 옆면 촬영 후 회전이 collision_monitor에 막혔다.
# 25°는 끝벽에서 약 10cm 안쪽이며, 촬영 후 다음 지점으로 돌아설 공간을 남긴다.
recheck_angle_deg: 25.0
home: {x: 0.0, y: 0.0, yaw: 0.0}
stops:
  - {id: P00, x: 1.61, y: 0.47, yaw: 1.545}
  - {id: P01, x: 0.41, y: 0.50, yaw: 1.545}
