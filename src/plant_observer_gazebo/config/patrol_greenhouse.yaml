# greenhouse 월드 순찰 루트 (patrol_manager route:=greenhouse)
# 좌표는 지도(map) 기준: 출발점 = (0, 0), +x = 출발할 때 로봇 정면(동쪽), +y = 왼쪽(북쪽)
# 지도 좌표 = Gazebo 좌표 + (1.6, 0). 관측 지점은 화분 중심에서 0.5m 앞:
# 다음 지점으로 가려면 제자리 회전해야 하는데, 차체 회전 반경(0.26m)이 화분(반지름 0.11m)에
# 닿지 않으려면 0.5m는 떨어져야 한다. 0.4m에서는 회전이 막혀 복구 동작이 돌았다
# yaw: 0 = +x, 1.5708 = +y(위쪽 줄 화분을 봄), -1.5708 = -y(아래쪽 줄 화분을 봄)
home: {x: 0.0, y: 0.0, yaw: 0.0}
stops:
  - {id: P00, x: 0.4, y: 0.5, yaw: 1.5708}
  - {id: P01, x: 1.6, y: 0.5, yaw: 1.5708}
  - {id: P02, x: 2.8, y: 0.5, yaw: 1.5708}
  - {id: P05, x: 2.8, y: -0.5, yaw: -1.5708}
  - {id: P04, x: 1.6, y: -0.5, yaw: -1.5708}
  - {id: P03, x: 0.4, y: -0.5, yaw: -1.5708}
